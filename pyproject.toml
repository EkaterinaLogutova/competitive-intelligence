[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "competitive-intelligence-test-task"
version = "0.1.0"
description = "Reproducible workspace for the competitive intelligence test assignment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
competitive-intelligence = "competitive_intelligence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

